name: OpenCode bridge

on:
  push:
    paths:
      - 'packages/opencode-bridge/**'
      - 'protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/opencode-bridge.yml'
  pull_request:
    paths:
      - 'packages/opencode-bridge/**'
      - 'protocol/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/opencode-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
